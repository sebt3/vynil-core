[package]
name = "vynil-core"
version = "0.7.2"
authors = [
    "Sébastien Huss <sebastien.huss@gmail.com>",
    "Xavier Mortelette <reivaxm@gmail.com>"
]
edition = "2024"
license = "BSD-3-Clause"
description = "A Rust toolbox for bootstrapping projects combining a Rhai scripting engine and a Handlebars templating engine, with optional Kubernetes / OCI / S3 handlers."
repository = "https://github.com/sebt3/vynil-core"
readme = "README.md"
keywords = ["rhai", "handlebars", "kubernetes", "templating", "scripting"]
categories = ["template-engine", "config"]

[features]
default = []
k8s = ["dep:kube", "dep:k8s-openapi", "dep:futures"]
oci = ["dep:oci-client"]
s3 = ["dep:object_store", "dep:futures"]
# Filesystem access from Rhai scripts (file_read/file_write/file_copy/create_dir/read_dir/is_file/is_dir).
fs = []
# Shell command execution from Rhai scripts (shell_run/shell_output).
shell = []
# vynil-core's own gen_password/gen_password_alphanum Rhai + Handlebars helpers (minimum-count
# based). Off by default so consumers with their own password generation semantics (e.g. a
# weight-based one exposed through a public API) don't get a name collision.
password = []

[dependencies]
rhai = { version = "1.20.0", features = ["sync", "serde", "internals"] }
handlebars = { version = "6.2.0", features = ["script_helper", "string_helpers"] }
handlebars_misc_helpers = { version = "0.17.0", features = ["string", "json", "jsonnet", "regex", "uuid"] }
reqwest = { version = "0.12.24", features = ["rustls-tls"] }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4.38", features = ["serde"] }
base64 = "0.23.1"
thiserror = "2.0.3"
tracing = "0.1.37"
sha256 = "1.5.0"
argon2 = { version = "0.5.3", features = ["std"] }
bcrypt = "0.19.2"
crc32fast = "1.5.0"
semver = { version = "1.0.24", features = ["serde"] }
url = "2.5.4"
regex = "1.12.2"
wildmatch = "2.6.1"
openssl = "0.10.73"
http = "1.1.0"
lazy_static = "1.5.0"
rand = "0.10.1"
schemars = { version = "1.0", features = ["chrono04"] }
actix-web = "4.12.1"
kube = { version = "3.1.0", features = ["runtime", "client", "derive"], optional = true }
k8s-openapi = { version = "0.27.1", features = ["latest", "schemars"], default-features = false, optional = true }
futures = { version = "0.3", optional = true }
oci-client = { version = "0.15.0", optional = true }
object_store = { version = "0.11", features = ["aws"], optional = true }
flate2 = "1.1.4"
tar = "0.4.46"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tower-test = "0.4.0"

[lib]
name = "vynil_core"
path = "src/lib.rs"

# use "cargo install cargo-commander", then "cargo cmd generate"
[package.metadata.commands]
fmt = { cmd=[
    "cargo +nightly fmt"
]}
precommit = { cmd=[
    "cargo update",
    "cargo clippy --fix --allow-dirty --allow-staged",
    "cargo +nightly fmt"
]}
