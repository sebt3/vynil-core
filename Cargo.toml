[package]
name = "vynil-core"
version = "0.7.3"
authors = [
    "Sébastien Huss <sebastien.huss@gmail.com>",
    "Xavier Mortelette <reivaxm@gmail.com>"
]
edition = "2024"
license = "BSD-3-Clause"
description = "A Rust toolbox for bootstrapping projects combining a Rhai scripting engine and a Handlebars templating engine, with optional Kubernetes / OCI / S3 handlers."
repository = "https://github.com/sebt3/vynil-core"
readme = "README.md"
keywords = ["rhai", "handlebars", "kubernetes", "templating", "scripting"]
categories = ["template-engine", "config"]

[features]
# http/crypto/rhai/hbs default on so a plain `vynil-core = "x"` dependency (no features picked)
# keeps compiling everything it always has — opting out of one of them is an explicit choice by
# a consumer that only wants a subset (e.g. just the Handlebars engine, or just Rhai).
default = ["http", "crypto", "rhai", "hbs"]
# K8sGeneric (src/k8s.rs) is built as a Rhai-facing API throughout (most of its methods return
# RhaiRes), not a plain Rust API with a Rhai wrapper on top like the other modules below — so
# unlike them it isn't independently rhai-optional, at least until a consumer actually needs
# "k8s without rhai".
k8s = ["dep:kube", "dep:k8s-openapi", "dep:futures", "dep:tokio", "rhai"]
# Registry::push_image et al. take/return rhai types (Map, ImmutableString) directly in their
# core signatures, same reasoning as k8s above.
oci = ["dep:oci-client", "dep:tokio", "rhai"]
# s3_get_yaml/s3_list_keys are RhaiRes-typed from the start, no plain-Rust equivalent — same
# reasoning as k8s above.
s3 = ["dep:object_store", "dep:futures", "dep:tokio", "rhai"]
# Filesystem access from Rhai scripts (file_read/file_write/file_copy/create_dir/read_dir/is_file/is_dir).
fs = []
# Shell command execution (run/get_out always available under this feature alone; the
# shell_run/shell_output Rhai bindings additionally need "rhai").
shell = []
# vynil-core's own gen_password/gen_password_alphanum Rhai + Handlebars helpers (minimum-count
# based). Off by default so consumers with their own password generation semantics (e.g. a
# weight-based one exposed through a public API) don't get a name collision.
password = []
# reqwest-based RestClient (src/http.rs) + schemars-derived config types. Like K8sGeneric above,
# RestClient stores its headers as a rhai::Map internally rather than wrapping a plain-Rust type,
# so it isn't independently rhai-optional either. RestClientMock (src/http_mock.rs) is a Rhai-only
# test double on top of it.
http = ["dep:reqwest", "dep:schemars", "dep:tokio", "rhai"]
# openssl-backed key generation (src/key.rs) + argon2/bcrypt password hashing (src/hashes.rs),
# used unconditionally by the "always" Handlebars helpers (argon_hash/bcrypt_hash/gen_private_key)
# when "hbs" is on. The Rhai bindings in both modules additionally need "rhai".
crypto = ["dep:openssl", "dep:argon2", "dep:bcrypt"]
# The Rhai scripting engine (src/engine.rs) plus every other module's *_rhai_register glue.
rhai = ["dep:rhai"]
# The Handlebars templating engine (src/hbs.rs, src/hbs_json.rs).
hbs = ["dep:handlebars", "dep:handlebars_misc_helpers", "dep:jmespath", "dep:toml"]

[dependencies]
rhai = { version = "1.20.0", features = ["sync", "serde", "internals"], optional = true }
handlebars = { version = "6.2.0", features = ["script_helper", "string_helpers"], optional = true }
handlebars_misc_helpers = { version = "0.17.0", default-features = false, features = ["string", "jsonnet", "regex", "uuid"], optional = true }
# Direct dep (not via handlebars_misc_helpers's "json" feature, still pinned to jmespath 0.3.0
# whose Function trait lacks a Send bound — see src/hbs_json.rs).
jmespath = { version = "0.5.0", optional = true }
toml = { version = "0.8", optional = true }
reqwest = { version = "0.12.24", features = ["rustls-tls"], optional = true }
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"], optional = true }
chrono = { version = "0.4.38", features = ["serde"] }
base64 = "0.23.1"
thiserror = "2.0.3"
tracing = "0.1.37"
sha256 = "1.5.0"
argon2 = { version = "0.5.3", features = ["std"], optional = true }
bcrypt = { version = "0.19.2", optional = true }
crc32fast = "1.5.0"
semver = { version = "1.0.24", features = ["serde"] }
url = "2.5.4"
regex = "1.12.2"
wildmatch = "2.6.1"
openssl = { version = "0.10.73", optional = true }
http = "1.1.0"
lazy_static = "1.5.0"
rand = "0.10.1"
schemars = { version = "1.0", features = ["chrono04"], optional = true }
kube = { version = "3.1.0", features = ["runtime", "client", "derive"], optional = true }
k8s-openapi = { version = "0.27.1", features = ["latest", "schemars"], default-features = false, optional = true }
futures = { version = "0.3", optional = true }
oci-client = { version = "0.15.0", optional = true }
object_store = { version = "0.14", features = ["aws"], optional = true }
flate2 = "1.1.4"
tar = "0.4.46"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tower-test = "0.4.0"

[lib]
name = "vynil_core"
path = "src/lib.rs"

# use "cargo install cargo-commander", then "cargo cmd generate"
[package.metadata.commands]
fmt = { cmd=[
    "cargo +nightly fmt"
]}
precommit = { cmd=[
    "cargo update",
    "cargo clippy --fix --allow-dirty --allow-staged",
    "cargo +nightly fmt"
]}
