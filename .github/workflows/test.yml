---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Liste d'objets { name, args } : `args` porte la ligne de flags complète, ce que la
      # forme « features: [...] » ne pouvait pas exprimer pour `--no-default-features` seul
      # (confondu avec l'entrée vide). Les deux portes sans `rhai` (no-default, hbs) sont
      # contractualisées par tooling.sdd et workflows.sdd.
      matrix:
        include:
          - name: default
            args: ""
          - name: no-default
            args: "--no-default-features"
          - name: hbs
            args: "--no-default-features --features hbs"
          - name: k8s
            args: "--no-default-features --features k8s"
          - name: oci
            args: "--no-default-features --features oci"
          - name: s3
            args: "--no-default-features --features s3"
          - name: k8s,oci,s3
            args: "--no-default-features --features k8s,oci,s3"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test ${{ matrix.args }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Harnais clippy porté par Cargo.toml [lints] (strict family + pedantic/cargo en deny,
      # missing_docs warn) + `-D warnings` pour les warnings rustc hors [lints]. La matrice de
      # features est rejouée ici : les analyses pedantic (pureté de `must_use_candidate`, etc.)
      # dépendent du graphe de features et un lint peut ne se déclencher que sur une combinaison
      # (voir ../../tooling.sdd). `set -e` : la première combinaison qui tombe fait échouer le job.
      - name: cargo clippy (feature matrix)
        run: |
          set -e
          cargo clippy --all-targets -- -D warnings
          for features in k8s oci s3 k8s,oci,s3; do
            cargo clippy --no-default-features --features "$features" --all-targets -- -D warnings
          done
          cargo clippy --all-features --all-targets -- -D warnings

  # Règle d'isolation de chaque feature (tooling.sdd) : --each-feature compile et linte
  # chaque feature seule, y compris les gates non couvertes par les combinaisons explicites
  # du job `clippy` (fs, shell, password, crypto, http, hbs sans rhai…) et vérifie ainsi
  # l'invariant d'isolabilité de `hbs` (vyvil-core.sdd). Ce job complète le job `clippy` :
  # les combinaisons explicites qui portent un sens (k8s,oci,s3 / --all-features) restent.
  feature-matrix:
    name: Feature matrix (cargo hack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy

      - name: Install cargo-hack
        uses: taiki-e/install-action@cargo-hack

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo hack check --each-feature
        run: cargo hack check --each-feature --no-dev-deps

      - name: cargo hack clippy --each-feature
        run: cargo hack clippy --each-feature --no-dev-deps -- -D warnings
